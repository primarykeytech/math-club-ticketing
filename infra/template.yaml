AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ticket Club static site, Cognito authentication, and S3-backed API.

Resources:
  TicketDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TicketSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TicketUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ticket-club-coaches
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  TicketUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref TicketUserPool
      ClientName: ticket-club-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_PASSWORD_AUTH]
      PreventUserExistenceErrors: ENABLED

  TicketApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, OPTIONS]
        AllowOrigins: ['*']
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              audience: [!Ref TicketUserPoolClient]
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${TicketUserPool}'

  TicketApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: app.handler
      Runtime: python3.12
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          DATA_BUCKET: !Ref TicketDataBucket
      Policies:
        - S3CrudPolicy: { BucketName: !Ref TicketDataBucket }
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketApi
            Path: /{proxy+}
            Method: ANY
            Auth: { Authorizer: CognitoAuthorizer }

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-ticket-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  TicketDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: TicketSiteOrigin
            DomainName: !GetAtt TicketSiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: TicketSiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies: { Forward: none }
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TicketSiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${TicketSiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${TicketDistribution}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${TicketApi}.execute-api.${AWS::Region}.amazonaws.com'
  UserPoolId:
    Value: !Ref TicketUserPool
  UserPoolClientId:
    Value: !Ref TicketUserPoolClient
  SiteBucketName:
    Value: !Ref TicketSiteBucket
  SiteUrl:
    Value: !Sub 'https://${TicketDistribution.DomainName}'
